server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: finance-planner
  main:
    web-application-type: servlet
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_planner}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

ai:
  active-provider: ${AI_ACTIVE_PROVIDER:deepseek}
  providers:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      api-url: https://api.deepseek.com/v1/chat/completions
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      temperature: ${AI_TEMPERATURE:0.7}
      max-tokens: ${AI_MAX_TOKENS:2048}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    moonshot:
      api-key: ${MOONSHOT_API_KEY:}
      api-url: https://api.moonshot.cn/v1/chat/completions
      model: ${MOONSHOT_MODEL:moonshot-v1-8k}
      temperature: ${AI_TEMPERATURE:0.7}
      max-tokens: ${AI_MAX_TOKENS:2048}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    qwen:
      api-key: ${QWEN_API_KEY:}
      api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      model: ${QWEN_MODEL:qwen-max}
      temperature: ${AI_TEMPERATURE:0.7}
      max-tokens: ${AI_MAX_TOKENS:2048}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  agent:
    max-context-tokens: ${AI_AGENT_MAX_CONTEXT_TOKENS:6000}
    compression-enabled: ${AI_AGENT_COMPRESSION_ENABLED:true}
  fallback:
    enabled: ${AI_FALLBACK_ENABLED:true}
    providers: ${AI_FALLBACK_PROVIDERS:deepseek,moonshot,qwen}
    failure-threshold: ${AI_FALLBACK_FAILURE_THRESHOLD:3}
    recovery-timeout-minutes: ${AI_FALLBACK_RECOVERY_MINUTES:5}
  rate-limit:
    daily-limit: ${AI_DAILY_LIMIT:10}

ocr:
  baidu:
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}

logging:
  level:
    com.finance.planner: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}
