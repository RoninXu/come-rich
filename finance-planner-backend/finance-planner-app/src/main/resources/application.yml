server:
  port: 8080

spring:
  application:
    name: finance-planner
  main:
    web-application-type: servlet
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/finance_planner
    username: finance
    password: finance123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

jwt:
  secret: mySecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughForHS512Algorithm
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

ai:
  active-provider: deepseek
  providers:
    deepseek:
      api-key: sk-91a5aef75bab41a68b64d8696a7a74a2
      api-url: https://api.deepseek.com/v1/chat/completions
      model: deepseek-chat
      temperature: 0.7
      max-tokens: 2048
      timeout-seconds: 60
    moonshot:
      api-key: ${MOONSHOT_API_KEY:}
      api-url: https://api.moonshot.cn/v1/chat/completions
      model: moonshot-v1-8k
      temperature: 0.7
      max-tokens: 2048
      timeout-seconds: 60
  rate-limit:
    daily-limit: 10

ocr:
  baidu:
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}

logging:
  level:
    com.finance.planner: DEBUG
    org.springframework.security: DEBUG
