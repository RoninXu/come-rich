# Production Profile Configuration
# All sensitive values MUST be provided via environment variables
# This file contains production-specific settings only

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

ai:
  active-provider: ${AI_ACTIVE_PROVIDER:deepseek}
  providers:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      api-url: https://api.deepseek.com/v1/chat/completions
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      temperature: ${AI_TEMPERATURE:0.7}
      max-tokens: ${AI_MAX_TOKENS:2048}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    moonshot:
      api-key: ${MOONSHOT_API_KEY:}
      api-url: https://api.moonshot.cn/v1/chat/completions
      model: ${MOONSHOT_MODEL:moonshot-v1-8k}
      temperature: ${AI_TEMPERATURE:0.7}
      max-tokens: ${AI_MAX_TOKENS:2048}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    qwen:
      api-key: ${QWEN_API_KEY:}
      api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      model: ${QWEN_MODEL:qwen-max}
      temperature: ${AI_TEMPERATURE:0.7}
      max-tokens: ${AI_MAX_TOKENS:2048}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  rate-limit:
    daily-limit: ${AI_DAILY_LIMIT:10}

ocr:
  baidu:
    api-key: ${BAIDU_OCR_API_KEY}
    secret-key: ${BAIDU_OCR_SECRET_KEY}

logging:
  level:
    root: WARN
    com.finance.planner: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
